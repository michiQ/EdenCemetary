const map = L.map('map',{zoomControl:true, maxZoom:22});
map.attributionControl.setPrefix('');
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:22, maxNativeZoom:19, attribution:'Imagery © Esri'});

// --- Section polygons (both modes) ---
const secLayer = L.layerGroup().addTo(map);
const secStyleIll = {color:'#7a6a4f', weight:1.4, fillColor:'#dccfae', fillOpacity:0.55};
const secStyleSat = {color:'#ffe9a8', weight:1.2, fillOpacity:0.04, fillColor:'#ffe9a8', dashArray:'4 3'};
let secPolys=[];
for (const [name,q] of Object.entries(SECTIONS)){
  const poly = L.polygon(q, secStyleIll).addTo(secLayer);
  secPolys.push(poly);
  const c = poly.getBounds().getCenter();
  L.marker(c,{icon:L.divIcon({className:'sec-label',html:'<span>'+name.toUpperCase()+'</span>'}),interactive:false}).addTo(secLayer);
}

// --- People markers ---
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
const markers = [];
for (const p of PEOPLE){
  const col = GROUPS[p.g][1];
  const m = L.circleMarker([p.lat,p.lng], {radius:7, color:'#fffdf7', weight:1.6, fillColor:col, fillOpacity:0.95});
  const gm = 'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+p.lat+','+p.lng;
  let hhtml = '<div class="card">';
  hhtml += '<span class="cat" style="background:'+col+'">'+esc(GROUPS[p.g][0])+'</span>';
  hhtml += '<h2>'+esc(p.n)+'</h2>';
  if(p.d) hhtml += '<div class="dates">'+esc(p.d)+'</div>';
  if(p.pic) hhtml += '<img loading="lazy" src="'+p.pic+'" onerror="this.remove()">';
  if(p.bio) hhtml += '<div class="bio">'+esc(p.bio)+'</div>';
  if(p.war) hhtml += '<div class="war">'+esc(p.war)+'</div>';
  hhtml += '<div class="plot">Section '+esc(p.sec)+' · Lot '+esc(p.lot)+'</div>';
  if(p.extra) hhtml += '<div class="extra">'+esc(p.extra)+'</div>';
  hhtml += '<div class="links"><a target="_blank" rel="noopener" href="'+gm+'">Walk here ➔</a>';
  if(p.hist) hhtml += '<a target="_blank" rel="noopener" href="'+p.hist+'">Learn more</a>';
  hhtml += '</div></div>';
  m.bindPopup(hhtml,{className:'popup',maxWidth:300});
  m.on('mouseover',()=>m.setStyle({radius:9,weight:2.5}));
  m.on('mouseout',()=>m.setStyle({radius:7,weight:1.6}));
  m.bindTooltip(p.n,{direction:'top',offset:[0,-6]});
  m._p = p;
  markers.push(m);
}
const dotLayer = L.layerGroup(markers).addTo(map);

// fit
const all = L.featureGroup(markers);
map.fitBounds(all.getBounds().pad(0.18));

const chipBox = document.getElementById('chips');
const active = {};
for (const [g,[label,col]] of Object.entries(GROUPS)){
  if (!PEOPLE.some(p=>p.g===g)) continue;
  active[g]=true;
  const c=document.createElement('span');
  c.className='chip'; c.innerHTML='<span class="dot" style="background:'+col+'"></span>'+label;
  c.onclick=()=>{active[g]=!active[g]; c.classList.toggle('off',!active[g]); refresh();};
  chipBox.appendChild(c);
}
const q=document.getElementById('q');
q.addEventListener('input',refresh);
function refresh(){
  const term=q.value.trim().toLowerCase();
  for (const m of markers){
    const p=m._p;
    const ok = active[p.g] && (!term || p.n.toLowerCase().includes(term) || (p.bio||'').toLowerCase().includes(term));
    if(ok){ if(!dotLayer.hasLayer(m)) dotLayer.addLayer(m); }
    else { dotLayer.removeLayer(m); }
  }
  const vis = markers.filter(m=>dotLayer.hasLayer(m));
  if(term && vis.length===1){ map.setView(vis[0].getLatLng(),19); vis[0].openPopup(); }
}

// --- base toggle ---
const el=document.getElementById('map');
const bI=document.getElementById('bIll'), bS=document.getElementById('bSat');
function setMode(m){
  if(m==='sat'){ sat.addTo(map); el.classList.remove('illust'); el.classList.add('sat');
    bS.classList.add('on'); bI.classList.remove('on');
    secPolys.forEach(p=>p.setStyle(secStyleSat));
  } else { map.removeLayer(sat); el.classList.add('illust'); el.classList.remove('sat');
    bI.classList.add('on'); bS.classList.remove('on');
    secPolys.forEach(p=>p.setStyle(secStyleIll));
  }
}
bI.onclick=()=>setMode('ill'); bS.onclick=()=>setMode('sat');
setMode('ill');
window._map=map;
</script>
<div class="footer-note">Dot positions are approximate (within a few paces). Eden Cemetery, 1434 Springfield Rd, Collingdale PA</div>
</body>
</html>
